      /* Apple dark-mode language: true black canvas, one sans family, system colours,
         translucent grouped surfaces, continuous large radii, calm decelerating motion. */
      :root {
        --bg: #000000;
        --surface: rgba(28, 28, 30, 0.86);
        --surface-2: #1c1c1e;
        --hairline: rgba(255, 255, 255, 0.12);
        --label: #f5f5f7;
        --secondary: #a1a1a6;
        --blue: #0a84ff;
        --red: #ff453a;
        --orange: #ff9f0a;
        --green: #30d158;
        --gray: #8e8e93;
        --sans: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: var(--bg); }
      #root {
        width: 100%; height: 100%; position: relative; overflow: hidden;
        background: var(--bg); color: var(--label); font-family: var(--sans);
        font-variant-numeric: tabular-nums;
      }
      .layer { position: absolute; inset: 0; }

      .think {
        position: absolute; left: 60px; width: 960px; border-radius: 56px;
        filter: blur(22px); will-change: opacity;
      }

      #eyebrow { position: absolute; left: 72px; top: 76px; font: 700 28px/1 var(--sans); color: var(--secondary); letter-spacing: -0.01em; }
      #foot {
        position: absolute; left: 72px; right: 72px; top: 1284px;
        display: flex; justify-content: space-between;
        font: 400 24px/1 var(--sans); color: var(--secondary);
      }

      /* scene A */
      #headline { position: absolute; left: 72px; top: 124px; width: 936px; font: 700 96px/1.02 var(--sans); letter-spacing: -0.045em; }
      #headline .dim { color: #6e6e73; }

      .card {
        position: absolute; left: 72px; top: 380px; width: 936px;
        border-radius: 44px; padding: 34px 40px 36px;
        background: var(--surface); border: 2px solid var(--hairline);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        transform-origin: 50% 50%; will-change: transform, opacity;
      }
      .mailhead { display: flex; align-items: center; gap: 20px; }
      .avatar {
        display: flex; align-items: center; justify-content: center; flex: none;
        width: 68px; height: 68px; border-radius: 50%;
        background: linear-gradient(180deg, #8e8e93, #636366); font: 700 32px/1 var(--sans); color: #fff;
      }
      .sender { flex: 1; font: 700 32px/1.1 var(--sans); letter-spacing: -0.01em; }
      .stamp { display: flex; align-items: center; gap: 10px; font: 400 26px/1 var(--sans); color: var(--secondary); }
      .stamp .jdot { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); }
      .card .text { font: 400 38px/1.3 var(--sans); margin-top: 24px; letter-spacing: -0.01em; }
      .tags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
      .tag { display: block; font: 700 26px/1 var(--sans); padding: 12px 20px; border-radius: 999px; background: rgba(142, 142, 147, 0.24); color: var(--label); }
      .tag.risk { background: rgba(255, 69, 58, 0.22); color: #ff8a82; }
      .tag.pitch { background: rgba(142, 142, 147, 0.3); color: #d1d1d6; }
      .tag.refund { background: rgba(255, 159, 10, 0.2); color: #ffc266; }
      .verdict {
        display: flex; align-items: center; gap: 16px; margin-top: 28px; padding-top: 26px;
        border-top: 2px solid var(--hairline); transform-origin: 0 50%;
      }
      .verdict .vdot { display: block; width: 18px; height: 18px; border-radius: 50%; flex: none; }
      .verdict .lane-name { font: 700 36px/1 var(--sans); letter-spacing: -0.02em; }
      .verdict .why { font: 400 30px/1 var(--sans); color: var(--secondary); }
      .glow { position: absolute; left: -40px; top: 320px; width: 1160px; height: 640px; border-radius: 50%; will-change: transform, opacity; }

      .qcard {
        position: absolute; left: 72px; top: 560px; width: 936px; height: 132px;
        border-radius: 36px; padding: 0 32px; background: var(--surface); border: 2px solid var(--hairline);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        display: flex; align-items: center; gap: 22px; transform-origin: 50% 50%; will-change: transform, opacity;
      }
      .qcard .avatar { width: 60px; height: 60px; font-size: 28px; }
      .qcard .qbody { flex: 1; min-width: 0; }
      .qcard .qfrom { display: block; font: 700 28px/1.1 var(--sans); }
      .qcard .qtext { display: block; margin-top: 6px; font: 400 28px/1.2 var(--sans); color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .qcard .qlane { flex: none; display: block; font: 700 26px/1 var(--sans); padding: 12px 18px; border-radius: 999px; }

      .tile {
        position: absolute; top: 966px; width: 222px; height: 256px;
        border-radius: 36px; padding: 24px; background: var(--surface-2); border: 2px solid var(--hairline);
      }
      .tile .name { display: flex; align-items: center; gap: 8px; font: 700 23px/1 var(--sans); white-space: nowrap; color: var(--secondary); }
      .tile .ldot { display: block; width: 14px; height: 14px; border-radius: 50%; flex: none; }
      .tile .count { display: block; width: 110px; margin-top: 14px; font: 700 72px/1 var(--sans); letter-spacing: -0.04em; transform-origin: 0 70%; }
      .token { position: absolute; width: 36px; height: 36px; border-radius: 50%; will-change: transform, opacity; }
      .token.miss { background: transparent !important; border: 4px dashed var(--orange); }

      /* scene B: keynote stat slide */
      #sceneB { opacity: 0; }
      #big { position: absolute; left: 72px; top: 250px; width: 936px; display: flex; align-items: baseline; gap: 28px; }

      #big-den { display: inline-block; font: 700 110px/1 var(--sans); letter-spacing: -0.04em; color: #6e6e73; }
      #lede { position: absolute; left: 72px; top: 600px; width: 936px; font: 700 56px/1.1 var(--sans); letter-spacing: -0.03em; }
      #sub { position: absolute; left: 72px; top: 680px; width: 936px; font: 400 38px/1.3 var(--sans); color: var(--secondary); letter-spacing: -0.01em; }
      .cols { position: absolute; left: 72px; top: 900px; width: 936px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; }
      .col { border-top: 2px solid var(--hairline); padding-top: 30px; }
      .col .val { display: block; font: 700 84px/1 var(--sans); letter-spacing: -0.045em; white-space: nowrap; transform-origin: 0 70%; }
      .col .lbl { display: block; margin-top: 18px; font: 400 28px/1.3 var(--sans); color: var(--secondary); }

      document.fonts.ready.then(() => {
        const { items, stats, lanes: LANE_NAMES } = DATA;
        const LANES = ["human_now", "human_queue", "auto", "archive"];
        const COLOR = { human_now: "#ff453a", human_queue: "#ff9f0a", auto: "#30d158", archive: "#8e8e93" };

        const setText = (id, text) => { const e = document.getElementById(id); if (e) e.textContent = text; };
        setText("foot-model", stats.model);
        setText("big-den", `of ${stats.n}`);
        setText("l-cost", `a month at ${stats.monthly_emails} emails`);

        // ---------- layout constants (authored, CSS-matched) ----------
        const TILE_W = 222, TILE_GAP = 16, LEFT = 72, TILE_TOP = 966, PAD = 24;
        const tileLeft = k => LEFT + LANES.indexOf(k) * (TILE_W + TILE_GAP);
        const TOKEN = 36, TOKEN_STEP = 46, TOKEN_TOP = TILE_TOP + PAD + 23 + 14 + 72 + 20;

        const tilesEl = document.getElementById("tiles");
        const laneCount = {};
        LANES.forEach(k => {
          const t = el("div", "tile");
          t.style.left = `${tileLeft(k)}px`;
          const name = el("div", "name");
          const d = el("span", "ldot"); d.style.background = COLOR[k];
          name.append(d, document.createTextNode(LANE_NAMES[k]));
          const count = el("span", "count", "0");
          t.append(name, count);
          tilesEl.appendChild(t);
          laneCount[k] = count;

        const slotOf = {};
        items.forEach(it => { slotOf[it.lane] = slotOf[it.lane] || 0; it.slot = slotOf[it.lane]++; });
        items.forEach(it => {
          const t = el("div", it.ok ? "token" : "token miss");
          if (it.ok) t.style.background = COLOR[it.lane];
          it.tx = tileLeft(it.lane) + PAD + (it.slot % 4) * TOKEN_STEP;
          it.ty = TOKEN_TOP + Math.floor(it.slot / 4) * TOKEN_STEP;
          t.style.left = `${it.tx}px`; t.style.top = `${it.ty}px`;
          tilesEl.appendChild(t);

        const Q0 = 5.75, QSTEP = 0.2;

        // ---------- build cards ----------
        const cardsEl = document.getElementById("cards");
        const glowsEl = document.getElementById("glows");
        const mailhead = it => {

          h.appendChild(s);
          return h;
        };
        heroes.forEach(it => {

        items.forEach(it => {

          const T = it.enter;
          tl.fromTo(it.card, { opacity: 0, y: 90, scale: 0.94, x: 0 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: SMOOTH }, T);

          tl.fromTo(it.think, { opacity: 0 }, { opacity: 0.5, duration: 0.4, ease: "power2.out" }, j0);

          tl.fromTo(it.glow, { opacity: 0, scale: 0.9 }, { opacity: it.lane === "human_now" ? 0.4 : 0.25, scale: 1, duration: 0.9, ease: "power2.out" }, vAt - 0.3);
          tl.to(it.glow, { opacity: 0, duration: 0.4, ease: "power1.in" }, it.exit);
          tl.fromTo(it.card, { x: 0, y: 0, scale: 1, opacity: 1 },
            { x: it.dx, y: it.dy, scale: 0.08, opacity: 0, duration: 0.5, ease: "power3.inOut", immediateRender: false }, it.exit);
        });

        quick.forEach(it => {
          tl.fromTo(it.card, { opacity: 0, scale: 0.94, y: -24, x: 0 }, { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power3.out" }, it.enter);
          tl.fromTo(it.card, { x: 0, y: 0, scale: 1 }, { x: it.dx, y: it.dy, scale: 0.08, duration: 0.3, ease: "power3.out", immediateRender: false }, it.exit);
          tl.fromTo(it.card, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, it.exit);
        });

        items.forEach(it => {
          tl.fromTo(it.token, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, it.land - 0.12);

        const meter = { p: 0 };

              laneCount[k].textContent = String(landed.length);
              const last = landed.length ? Math.max(...landed.map(it => it.land - 0.1)) : -9;
